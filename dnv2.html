<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Null Electric Calc | Basic</title>

  <style>
    :root{
      --bg:#0b0d12;
      --bd:rgba(255,255,255,.12);
      --txt:#e9eefc;
      --muted:rgba(233,238,252,.65);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --r:18px;
      --r2:22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",Helvetica,Arial,sans-serif;
      background: var(--bg);
      color:var(--txt);
    }
    .wrap{ max-width:980px; margin:0 auto; padding:16px; }

    .top{
      display:flex; justify-content:space-between; align-items:flex-end;
      gap:12px; flex-wrap:wrap;
      padding:14px 16px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--bd);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
    }
    h1{ margin:0; font-size:18px; font-weight:900; }
    .spec{ font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }

    .status{
      padding:8px 12px;
      border:1px solid var(--bd);
      border-radius:999px;
      font-size:12px;
      font-weight:900;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:12px;
    }
    @media(min-width:860px){
      .grid{ grid-template-columns:1.2fr .8fr; }
    }

    .card{
      background:rgba(255,255,255,.035);
      border:1px solid var(--bd);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
      padding:14px;
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:700;
    }
    select,input{
      width:100%;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid var(--bd);
      background:rgba(0,0,0,.25);
      color:var(--txt);
      font-size:15px;
      outline:none;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .row>*{ flex:1 1 180px; }
    .hr{ height:1px; background:rgba(255,255,255,.15); margin:12px 0; }

    .kpi{ font-size:38px; font-weight:900; }
    .kpi-sub{ font-size:13px; color:var(--muted); margin-top:6px; }

    .mono{
      margin-top:10px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:12.5px;
      line-height:1.6;
      white-space:pre-wrap;
      background:rgba(0,0,0,.25);
      border:1px solid var(--bd);
      border-radius:14px;
      padding:10px;
    }

    details{
      margin-top:12px;
      border:1px solid var(--bd);
      border-radius:var(--r2);
      padding:10px 12px;
      background:rgba(0,0,0,.25);
    }
    summary{ cursor:pointer; font-weight:900; font-size:13px; }
    details p, details li{ font-size:13px; color:var(--muted); }

    footer{
      margin-top:10px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,.2);
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>Null Electric Calc</h1>
      <div class="spec">
        <span>Basic</span>
        <span>ラック</span>
        <span>30℃</span>
        <span>pf 0.85</span>
        <span>eff 0.90</span>
        <span>+10%</span>
      </div>
    </div>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="grid">
    <!-- INPUT -->
    <div class="card">
      <div class="row">
        <div>
          <label>Mode</label>
          <select id="mode">
            <option value="kw-to-a">kW → A</option>
            <option value="a-to-kw">A → kW</option>
            <option value="vdrop">V-drop</option>
          </select>
        </div>
        <div>
          <label>Phase</label>
          <select id="phase">
            <option value="single">単相</option>
            <option value="three">三相</option>
          </select>
        </div>
        <div>
          <label>Voltage (V)</label>
          <input id="voltage" inputmode="decimal" placeholder="200" />
        </div>
      </div>

      <div class="hr"></div>

      <div id="kw-to-a">
        <label>Power (kW)</label>
        <input id="kw" inputmode="decimal" placeholder="5.5" />
      </div>

      <div id="a-to-kw" style="display:none">
        <label>Current (A)</label>
        <input id="amp" inputmode="decimal" placeholder="25" />
      </div>

      <div id="vdrop" style="display:none">
        <div class="row">
          <div>
            <label>Current (A)</label>
            <input id="ampVD" inputmode="decimal" placeholder="30" />
          </div>
          <div>
            <label>Distance (m)（片道）</label>
            <input id="dist" inputmode="decimal" placeholder="50" />
          </div>
          <div>
            <label>Wire (sq)</label>
            <input id="sq" inputmode="decimal" placeholder="2" />
          </div>
        </div>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <div class="kpi" id="kpi">—</div>
      <div class="kpi-sub" id="kpiSub">入力すると自動計算</div>

      <div class="mono" id="detail">
Mode: —
Phase: —
V: —
      </div>

      <details>
        <summary>使い方・計算条件</summary>
        <ul>
          <li>入力すると自動で計算されます</li>
          <li>kW↔A、電圧降下の目安確認用</li>
          <li>標準条件は社内基準で固定</li>
        </ul>
        <p>
          ラック敷設 / 30℃ / 力率0.85 / 効率0.90 / マージン10%<br>
          電圧降下は簡易式（抵抗ベース / Cu想定）<br>
          条件が異なる場合は別途検討してください
        </p>
      </details>

      <footer id="null-copyright">
        © 2025 Null / 516ockz
      </footer>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Basic fixed spec
  const PF = 0.85;
  const EFF = 0.90;
  const M = 0.10;

  // V-drop limit (Basic固定)
  const VDROP_LIMIT_PCT = 2.0;

  // parse number (強め)
  const num = v => {
    if (v === null || v === undefined) return null;
    const s0 = String(v).trim();
    if (!s0) return null;

    // 全角→半角（数字とドット）
    const s1 = s0.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0))
                .replace(/[．]/g, ".");

    const x = parseFloat(s1);
    return Number.isFinite(x) ? x : null;
  };

  function showPanels(){
    const m = $("mode").value;
    $("kw-to-a").style.display = (m==="kw-to-a") ? "block" : "none";
    $("a-to-kw").style.display = (m==="a-to-kw") ? "block" : "none";
    $("vdrop").style.display  = (m==="vdrop")  ? "block" : "none";
  }

  function calc(){
    const mode = $("mode").value;
    const phase = $("phase").value;
    const V = num($("voltage").value);
    const root = phase==="three" ? Math.sqrt(3) : 1;

    let kpi = "—";
    let sub = "入力すると自動計算";
    let st  = "Ready";

    // detail base
    let detail = `Mode: ${mode}\nPhase: ${phase}\nV: ${V ?? "—"}`;

    if (mode === "kw-to-a") {
      const kW = num($("kw").value);
      if (V && kW) {
        const I = kW*1000*(1+M)/(V*root*PF*EFF);
        kpi = I.toFixed(2) + " A";
        sub = "kW → A（設計マージン込み）";
        st = "OK";
      }
    }

    if (mode === "a-to-kw") {
      const I = num($("amp").value);
      if (V && I) {
        const kW = (I*V*root*PF*EFF/1000)/(1+M);
        kpi = kW.toFixed(3) + " kW";
        sub = "A → kW（設計マージン除外値）";
        st = "OK";
      }
    }

    if (mode === "vdrop") {
      const I = num($("ampVD").value);
      const L = num($("dist").value); // one-way
      const A = num($("sq").value);

      detail += `\nI: ${I ?? "—"}  L: ${L ?? "—"}  sq: ${A ?? "—"}`;

      if (V && I && L && A) {
        // Cu ρ[Ω·mm²/m]代表値
        const rho = 0.01724;
        const R = rho * L / A;

        // single: ΔV = 2 I R, three: ΔV = √3 I R
        const dV = (phase==="three") ? (Math.sqrt(3)*I*R) : (2*I*R);
        const pct = dV / V * 100;
        const Vload = V - dV;

        // 大表示を「負荷側電圧」にする（意味が直感的）
        kpi = Vload.toFixed(1) + " V";
        sub = `ΔV ${dV.toFixed(1)}V（${pct.toFixed(2)}%）基準 ${VDROP_LIMIT_PCT.toFixed(1)}%`;

        st = (pct <= VDROP_LIMIT_PCT) ? "OK" : "NG";
      } else {
        sub = "電圧/A/距離/sqを入力";
      }
    }

    $("status").textContent = st;
    $("kpi").textContent = kpi;
    $("kpiSub").textContent = sub;
    $("detail").textContent = detail;
  }

  // debounce auto calc
  let t;
  function auto(){
    clearTimeout(t);
    t = setTimeout(calc, 120);
  }

  // events
  ["mode","phase","voltage","kw","amp","ampVD","dist","sq"].forEach(id=>{
    $(id)?.addEventListener("input", auto);
  });
  $("mode").addEventListener("change", ()=>{
    showPanels();
    auto();
  });

  showPanels();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Null Electric Calc | Basic</title>

  <style>
    :root{
      --bg:#0b0d12;
      --bd:rgba(255,255,255,.12);
      --txt:#e9eefc;
      --muted:rgba(233,238,252,.65);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --r2:22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",Helvetica,Arial,sans-serif;
      background: var(--bg);
      color:var(--txt);
    }
    .wrap{ max-width:980px; margin:0 auto; padding:16px; }

    .top{
      display:flex; justify-content:space-between; align-items:flex-end;
      padding:14px 16px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--bd);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
    }
    h1{ margin:0; font-size:18px; font-weight:900; }

    .status{
      padding:8px 12px;
      border:1px solid var(--bd);
      border-radius:999px;
      font-size:12px;
      font-weight:900;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:12px;
    }
    @media(min-width:860px){
      .grid{ grid-template-columns:1.2fr .8fr; }
    }

    .card{
      background:rgba(255,255,255,.035);
      border:1px solid var(--bd);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
      padding:14px;
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:700;
    }
    select,input{
      width:100%;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid var(--bd);
      background:rgba(0,0,0,.25);
      color:var(--txt);
      font-size:15px;
      outline:none;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .row>*{ flex:1 1 180px; }
    .hr{ height:1px; background:rgba(255,255,255,.15); margin:12px 0; }

    .kpi{ font-size:38px; font-weight:900; }
    .kpi-sub{ font-size:13px; color:var(--muted); margin-top:6px; }

    .mono{
      margin-top:10px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:12.5px;
      line-height:1.6;
      white-space:pre-wrap;
      background:rgba(0,0,0,.25);
      border:1px solid var(--bd);
      border-radius:14px;
      padding:10px;
    }

    details{
      margin-top:12px;
      border:1px solid var(--bd);
      border-radius:var(--r2);
      padding:10px 12px;
      background:rgba(0,0,0,.25);
    }
    summary{ cursor:pointer; font-weight:900; font-size:13px; }
    details p, details li{ font-size:13px; color:var(--muted); }

    footer{
      margin-top:10px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,.2);
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <h1>Null Electric Calc</h1>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="grid">
    <!-- INPUT -->
    <div class="card">
      <div class="row">
        <div>
          <label>Mode</label>
          <select id="mode">
            <option value="kw-to-a">kW → A</option>
            <option value="vdrop">V-drop</option>
          </select>
        </div>
        <div>
          <label>Phase</label>
          <select id="phase">
            <option value="single">単相</option>
            <option value="three">三相</option>
          </select>
        </div>
        <div>
          <label>Voltage (V)</label>
          <input id="voltage" inputmode="decimal" placeholder="200" />
        </div>
      </div>

      <div class="hr"></div>

      <div id="kw-to-a">
        <label>Power (kW)</label>
        <input id="kw" inputmode="decimal" placeholder="5.5" />
      </div>

      <div id="vdrop" style="display:none">
        <div class="row">
          <div>
            <label>Current (A)</label>
            <input id="ampVD" inputmode="decimal" placeholder="30" />
          </div>
          <div>
            <label>Distance (m)（片道）</label>
            <input id="dist" inputmode="decimal" placeholder="50" />
          </div>
          <div>
            <label>Wire (sq)</label>
            <input id="sq" inputmode="decimal" placeholder="2" />
          </div>
        </div>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <div class="kpi" id="kpi">—</div>
      <div class="kpi-sub" id="kpiSub">入力すると自動計算</div>

      <div class="mono" id="detail">
Mode: —
Phase: —
V: —
      </div>

      <details>
        <summary>使い方・計算条件</summary>
        <ul>
          <li>入力すると自動で計算されます（ボタン無し）</li>
          <li>kW → A は電気入力の基本式（力率のみ反映）</li>
          <li>V-drop は負荷側電圧を大きく表示</li>
          <li>Distance は片道距離</li>
        </ul>
        <p>
          電圧降下は簡易式（Cu抵抗ベース / ρ=0.01724 Ω·mm²/m）<br>
          ※条件が異なる場合は別途検討
        </p>
      </details>

      <footer id="null-copyright">
        © 2025 Null / 516ockz
      </footer>
    </div>
  </div>
</div>

<script>
(() => {
  const VERSION = "basic-final-1.0.0";
  const $ = id => document.getElementById(id);

  // 固定条件（Basic）
  const PF = 0.85;
  const VDROP_LIMIT_PCT = 2.0;

  const num = (v) => {
    if (v === null || v === undefined) return null;
    let s = String(v).trim();
    if (!s) return null;
    s = s
      .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .replace(/[．]/g, ".")
      .replace(/[，]/g, ",")
      .replace(/[－]/g, "-");
    s = s.replace(/,/g, "");
    const x = parseFloat(s);
    return Number.isFinite(x) ? x : null;
  };

  function showPanels(){
    const m = $("mode").value;
    $("kw-to-a").style.display = (m==="kw-to-a") ? "block" : "none";
    $("vdrop").style.display  = (m==="vdrop")  ? "block" : "none";
  }

  function calc(){
    const mode  = $("mode").value;
    const phase = $("phase").value;
    const V = num($("voltage").value);
    const root = phase==="three" ? Math.sqrt(3) : 1;

    let kpi = "—";
    let sub = "入力すると自動計算";
    let st  = "Ready";

    let detail = `Mode: ${mode}\nPhase: ${phase}\nV: ${V ?? "—"}\nVer: ${VERSION}`;

    if (mode === "kw-to-a") {
      const kW = num($("kw").value);
      if (V && kW) {
        const I = (kW*1000) / (V*root*PF);
        kpi = I.toFixed(2) + " A";
        sub = "kW → A";
        st = "OK";
      }
    }

    if (mode === "vdrop") {
      const I = num($("ampVD").value);
      const L = num($("dist").value);
      const A = num($("sq").value);

      detail += `\nI: ${I ?? "—"}  L(one-way): ${L ?? "—"}  sq: ${A ?? "—"}`;

      if (V && I && L && A) {
        const rho = 0.01724;
        const R = rho * L / A;
        const dV = (phase==="three") ? (Math.sqrt(3)*I*R) : (2*I*R);
        const pct = dV / V * 100;
        const Vload = V - dV;

        kpi = Vload.toFixed(1) + " V";
        sub = `ΔV ${dV.toFixed(1)}V（${pct.toFixed(2)}%）`;
        st = (pct <= VDROP_LIMIT_PCT) ? "OK" : "NG";
      } else {
        sub = "電圧/A/距離/sqを入力";
      }
    }

    $("status").textContent = st;
    $("kpi").textContent = kpi;
    $("kpiSub").textContent = sub;
    $("detail").textContent = detail;
  }

  let t;
  function auto(){
    clearTimeout(t);
    t = setTimeout(calc, 120);
  }

  ["mode","phase","voltage","kw","ampVD","dist","sq"].forEach(id=>{
    $(id)?.addEventListener("input", auto);
  });
  $("mode").addEventListener("change", ()=>{
    showPanels();
    auto();
  });

  showPanels();
})();
</script>
</body>
</html>

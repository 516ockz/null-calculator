<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Null Electric Calc | Basic</title>

  <style>
    :root{
      --bg:#0b0d12;
      --card:#0f172a;
      --bd:rgba(255,255,255,.12);
      --txt:#e9eefc;
      --muted:rgba(233,238,252,.65);
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --r:18px;
      --r2:22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",Helvetica,Arial,sans-serif;
      background: var(--bg);
      color:var(--txt);
    }

    .wrap{ max-width:980px; margin:0 auto; padding:16px; }

    .top{
      display:flex; justify-content:space-between; align-items:flex-end;
      gap:12px; flex-wrap:wrap;
      padding:14px 16px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--bd);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
    }

    h1{ margin:0; font-size:18px; font-weight:900; }
    .spec{ font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }

    .status{
      padding:8px 12px;
      border:1px solid var(--bd);
      border-radius:999px;
      font-size:12px;
      font-weight:900;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:12px;
    }
    @media(min-width:860px){
      .grid{ grid-template-columns:1.2fr .8fr; }
    }

    .card{
      background:rgba(255,255,255,.035);
      border:1px solid var(--bd);
      border-radius:var(--r2);
      box-shadow:var(--shadow);
      padding:14px;
    }

    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:700;
    }

    select,input{
      width:100%;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid var(--bd);
      background:rgba(0,0,0,.25);
      color:var(--txt);
      font-size:15px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .row>*{ flex:1 1 180px; }

    .hr{ height:1px; background:rgba(255,255,255,.15); margin:12px 0; }

    .kpi{
      font-size:38px;
      font-weight:900;
    }
    .kpi-sub{
      font-size:13px;
      color:var(--muted);
      margin-top:6px;
    }

    .mono{
      margin-top:10px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:12.5px;
      line-height:1.6;
      white-space:pre-wrap;
      background:rgba(0,0,0,.25);
      border:1px solid var(--bd);
      border-radius:14px;
      padding:10px;
    }

    details{
      margin-top:12px;
      border:1px solid var(--bd);
      border-radius:var(--r2);
      padding:10px 12px;
      background:rgba(0,0,0,.25);
    }
    summary{
      cursor:pointer;
      font-weight:900;
      font-size:13px;
    }
    details p, details li{
      font-size:13px;
      color:var(--muted);
    }

    footer{
      margin-top:10px;
      padding-top:10px;
      border-top:1px dashed rgba(255,255,255,.2);
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>Null Electric Calc</h1>
      <div class="spec">
        <span>Basic</span>
        <span>ラック</span>
        <span>30℃</span>
        <span>pf 0.85</span>
        <span>eff 0.90</span>
        <span>+10%</span>
      </div>
    </div>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="grid">
    <!-- INPUT -->
    <div class="card">
      <div class="row">
        <div>
          <label>Mode</label>
          <select id="mode">
            <option value="kw-to-a">kW → A</option>
            <option value="a-to-kw">A → kW</option>
            <option value="vdrop">V-drop</option>
          </select>
        </div>
        <div>
          <label>Phase</label>
          <select id="phase">
            <option value="single">単相</option>
            <option value="three">三相</option>
          </select>
        </div>
        <div>
          <label>Voltage (V)</label>
          <input id="voltage" inputmode="decimal" placeholder="200" />
        </div>
      </div>

      <div class="hr"></div>

      <div id="kw-to-a">
        <label>Power (kW)</label>
        <input id="kw" inputmode="decimal" placeholder="5.5" />
      </div>

      <div id="a-to-kw" style="display:none">
        <label>Current (A)</label>
        <input id="amp" inputmode="decimal" placeholder="25" />
      </div>

      <div id="vdrop" style="display:none">
        <div class="row">
          <div>
            <label>Current (A)</label>
            <input id="ampVD" inputmode="decimal" />
          </div>
          <div>
            <label>Distance (m)</label>
            <input id="dist" inputmode="decimal" />
          </div>
          <div>
            <label>Wire (sq)</label>
            <input id="sq" inputmode="decimal" />
          </div>
        </div>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card">
      <div class="kpi" id="kpi">—</div>
      <div class="kpi-sub" id="kpiSub">入力すると自動計算</div>

      <div class="mono" id="detail">
Mode: —
Phase: —
V: —
      </div>

      <details>
        <summary>使い方・計算条件</summary>
        <ul>
          <li>入力すると自動で計算されます</li>
          <li>kW↔A、電圧降下の目安確認用</li>
          <li>標準条件は社内基準で固定</li>
        </ul>
        <p>
          ラック敷設 / 30℃ / 力率0.85 / 効率0.90 / マージン10%<br>
          条件が異なる場合は別途検討してください
        </p>
      </details>

      <footer id="null-copyright">
        © 2025 Null / 516ockz
      </footer>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PF = 0.85, EFF = 0.90, M = 0.10;

  const num = v => {
    if (!v) return null;
    return parseFloat(String(v).replace(/[０-９．]/g,c=>
      String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
  };

  function showPanels(){
    $("kw-to-a").style.display = $("mode").value==="kw-to-a"?"block":"none";
    $("a-to-kw").style.display = $("mode").value==="a-to-kw"?"block":"none";
    $("vdrop").style.display  = $("mode").value==="vdrop" ?"block":"none";
  }

  function calc(){
    const mode=$("mode").value, phase=$("phase").value;
    const V=num($("voltage").value);
    const root = phase==="three"?Math.sqrt(3):1;

    let kpi="—", sub="入力すると自動計算", st="Ready";
    let log=[];

    if(mode==="kw-to-a" && V && num($("kw").value)){
      const kW=num($("kw").value);
      const I=kW*1000*(1+M)/(V*root*PF*EFF);
      kpi=I.toFixed(2)+" A";
      sub="kW → A";
      st="OK";
    }

    if(mode==="a-to-kw" && V && num($("amp").value)){
      const I=num($("amp").value);
      const kW=(I*V*root*PF*EFF/1000)/(1+M);
      kpi=kW.toFixed(3)+" kW";
      sub="A → kW";
      st="OK";
    }

    if(mode==="vdrop" && V && num($("ampVD").value) && num($("dist").value) && num($("sq").value)){
      const I=num($("ampVD").value), L=num($("dist").value), A=num($("sq").value);
      const rho=0.01724;
      const R=rho*L/A;
      const dV=phase==="three"?Math.sqrt(3)*I*R:2*I*R;
      const pct=dV/V*100;
      kpi=pct.toFixed(2)+" %";
      sub="電圧降下";
      st="OK";
    }

    $("status").textContent=st;
    $("kpi").textContent=kpi;
    $("kpiSub").textContent=sub;
    $("detail").textContent=`Mode: ${mode}\nPhase: ${phase}\nV: ${V??"—"}`;
  }

  let t;
  function auto(){
    clearTimeout(t);
    t=setTimeout(calc,120);
  }

  ["mode","phase","voltage","kw","amp","ampVD","dist","sq"].forEach(id=>{
    $(id)?.addEventListener("input",auto);
  });
  $("mode").addEventListener("change",()=>{showPanels();auto();});

  showPanels();
})();
</script>
</body>
</html>

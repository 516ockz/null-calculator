<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nul Tools</title>
  <style>
    :root {
      --bg: #070707;
      --card: #111;
      --card2: #171717;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --line: rgba(255,255,255,.12);
      --accent: #c8ff00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(200,255,0,.12), transparent 32%),
        radial-gradient(circle at bottom left, rgba(255,255,255,.06), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 34px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .tag {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-align: right;
      line-height: 1.5;
    }

    .hero {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 8vw, 56px);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 28px;
    }

    .tool {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(145deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0,0,0,.32);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .tool:active {
      transform: scale(.98);
    }

    @media (hover: hover) {
      .tool:hover {
        transform: translateY(-2px);
        border-color: rgba(200,255,0,.45);
      }
    }

    .tool-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .tool-title {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.03em;
    }

    .arrow {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.08);
      color: var(--accent);
      flex: 0 0 auto;
    }

    .tool-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .file {
      margin-top: 12px;
      color: rgba(200,255,0,.8);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .footer {
      margin-top: 28px;
      color: rgba(255,255,255,.38);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="logo">Nul</div>
      <div class="tag">Null × Rebuild × Optimal</div>
    </header>

    <section class="hero">
      <h1>Tools</h1>
      <p class="lead">現場で使うための、シンプルな計算ツール集</p>
    </section>

    <section class="grid" aria-label="Nul tools">
      <a class="tool" href="cable.html">
        <div class="tool-head">
          <div class="tool-title">許容電流</div>
          <div class="arrow">→</div>
        </div>
        <p class="tool-desc">電流値から電線サイズの目安を確認</p>
        <div class="file">cable.html</div>
      </a>

      <a class="tool" href="air.html">
        <div class="tool-head">
          <div class="tool-title">エアコン選定</div>
          <div class="arrow">→</div>
        </div>
        <p class="tool-desc">部屋サイズから業務用エアコン能力を簡易選定</p>
        <div class="file">air.html</div>
      </a>

      <a class="tool" href="ventilation.html">
        <div class="tool-head">
          <div class="tool-title">換気</div>
          <div class="arrow">→</div>
        </div>
        <p class="tool-desc">容積と用途から必要換気量を計算</p>
        <div class="file">ventilation.html</div>
      </a>

      <a class="tool" href="lighting.html">
        <div class="tool-head">
          <div class="tool-title">照度</div>
          <div class="arrow">→</div>
        </div>
        <p class="tool-desc">面積と用途から必要照度・器具台数を計算</p>
        <div class="file">lighting.html</div>
      </a>
    </section>

    <div class="footer">Built for field decisions.</div>
  </main>
</body>
</html>
